# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - oms-customer

on:
  push:
    branches:
      - stable
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js version
        uses: actions/setup-node@v1
        with:
          node-version: '14.x'

      - name: npm install, build, and test
        run: |
          npm install
          CI=false npm run build --if-present
          npm run test --if-present
        env:
          REACT_APP_API_URL = https://arcelor-mittal.oms-backend.equip-t.com
          REACT_APP_ENV = production
          REACT_APP_RELEASE = 1.0.0
          ERROR_REPORTING_ORGANIZATION = vebholic-pvt-ltd
          ERROR_REPORTING_PROJECT = om
          ERROR_REPORTING_API_TOKEN = 9702b27bd9f64ef29e8d55c7293393617d948d3f8b5841f2b429219da44dc1f5

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v2
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v2
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'oms-customer'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_172A9C40AE8F431CB72A13594F625D71 }}
          package: .
